        - shadow
        - strategy
        - promotion
        - learningPolicy
        - stageFeatureAssessments
        - recentTriggers
    ShadowCoreLearningPolicy:
      type: object
      properties:
        version:
          type: string
        priority:
          type: string
          enum: [highest]
        directions:
          type: object
          additionalProperties:
            type: object
            properties:
              label:
                type: string
              objective:
                type: string
            required: [label, objective]
        sharedValueCriteria:
          type: array
          items:
            type: string
            enum:
              - predictive_power
              - earliness
              - risk_reward_improvement
              - incremental_information_value
              - stability
              - noise_false_signal_rate
        coreAdmissionRule:
          type: string
      required: [version, priority, directions, sharedValueCriteria, coreAdmissionRule]
    ShadowStageFeatureValueAssessment:
      type: object
      properties:
        stage:
          type: string
          enum: [pre_breakout, true_breakout, post_breakout]
        featureKey:
          type: string
        tier:
          type: string
          enum: [A_core, B_supporting, C_redundant, D_noise, unavailable]
        sampleState:
          type: string
          enum: [available, insufficient_sample, unavailable]
        sampleSize:
          type: number
          minimum: 0
        predictiveAdvantagePercent:
          type: [number, "null"]
        averageLeadTimeMinutes:
          type: [number, "null"]
        riskRewardAdvantagePercent:
          type: [number, "null"]
        incrementalValuePercent:
          type: [number, "null"]
        stabilityPercent:
          type: [number, "null"]
        noiseRatePercent:
          type: [number, "null"]
        redundancyPercent:
          type: [number, "null"]
        coreEligible:
          type: boolean
        reason:
          type: string
      required:
        - stage
        - featureKey
        - tier
        - sampleState
        - sampleSize
        - predictiveAdvantagePercent
        - averageLeadTimeMinutes
        - riskRewardAdvantagePercent
        - incrementalValuePercent
        - stabilityPercent
        - noiseRatePercent
        - redundancyPercent
        - coreEligible
        - reason
