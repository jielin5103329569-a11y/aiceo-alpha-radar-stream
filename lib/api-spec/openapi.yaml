              enum: [idle, refreshing, ready, degraded, unavailable]
            refreshInFlight: { type: boolean }
            bridgeRunning: { type: boolean }
            startedAt:
              type: [string, "null"]
              format: date-time
            stoppedAt:
              type: [string, "null"]
              format: date-time
            lastActivityAt:
              type: [string, "null"]
              format: date-time
            lastBridgeMessageAt:
              type: [string, "null"]
              format: date-time
            lastCompletedAt:
              type: [string, "null"]
              format: date-time
            lastAttemptAt:
              type: [string, "null"]
              format: date-time
            refreshedAt:
