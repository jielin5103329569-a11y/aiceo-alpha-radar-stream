openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: Safe market data connection and stream status
  - name: alerts
    description: Account-scoped verified Alpha alerts and notification settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /radar/status:
    get:
      operationId: getRadarStatus
      tags: [radar]
      summary: Get the current safe market-data stream status
      responses:
        "200":
          description: Current radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/connect:
    post:
      operationId: startRadarConnection
      tags: [radar]
      summary: Start the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/disconnect:
    post:
      operationId: stopRadarConnection
      tags: [radar]
      summary: Stop the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/events:
    get:
      operationId: streamRadarEvents
      tags: [radar]
      summary: Receive safe radar status updates as server-sent events
      responses:
        "200":
          description: Server-sent radar state updates
          content:
            text/event-stream:
              schema:
                type: string
  /radar/universe:
    get:
      operationId: getMarketUniverse
      tags: [radar]
      summary: Query the low-frequency U.S. equity reference universe
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 64
        - in: query
          name: eligibility
          schema:
            type: string
            enum: [eligible, ineligible, all]
            default: eligible
        - in: query
          name: lifecycle
          schema:
            anyOf:
              - $ref: "#/components/schemas/SecurityLifecycleStatus"
              - type: string
                enum: [all]
            default: all
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Bounded reference-universe results and quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketUniverseResult"
  /radar/focused-scans:
    get:
      operationId: getFocusedScanStatus
      tags: [radar]
      summary: Get bounded focused-scan routing status and capability gates
      responses:
        "200":
          description: Read-only focused-scan capacity, authorization, reference, and candidate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusedScanSnapshot"
  /radar/catalysts:
    get:
      operationId: getCatalystRadar
      tags: [radar]
      summary: Get source availability and observed catalyst events
      responses:
        "200":
          description: Provider-neutral catalyst source status; unavailable sources never emit synthetic events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalystRadarSnapshot"
  /radar/opportunities:
    get:
      operationId: getOpportunityCenter
      tags: [radar]
      summary: Get evidence-led market opportunities and missing confirmation gates
      responses:
        "200":
          description: Current opportunity evidence chains for the protected live universe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityCenterSnapshot"
  /radar/validation:
    get:
      operationId: getSignalValidation
      tags: [radar]
      summary: Get immutable signal validation metrics and recent records
      parameters:
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/ValidationSignalState"
        - in: query
          name: sector
          schema:
            type: string
            maxLength: 120
        - in: query
          name: signalType
          schema:
            $ref: "#/components/schemas/ValidationSignalType"
        - in: query
          name: horizonDays
          schema:
            type: number
            enum: [1, 3, 5, 10, 20]
            default: 5
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Persistent trigger-time records and future-only outcome metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalValidationDashboard"
  /radar/validation/signals/{signalId}:
    get:
      operationId: getSignalValidationAudit
      tags: [radar]
      summary: Audit one immutable signal and its outcome checkpoints
      parameters:
        - in: path
          name: signalId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Full trigger-time evidence chain and checkpoint history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalValidationAudit"
  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List verified Alpha alerts with the current account's read state
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Account-scoped alert history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsListResponse"
  /alerts/settings:
    get:
      operationId: getAlertSettings
      tags: [alerts]
      summary: Get account-scoped notification settings
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
    put:
      operationId: updateAlertSettings
      tags: [alerts]
      summary: Update account-scoped notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertSettingsRequest"
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
  /alerts/read-all:
    post:
      operationId: markAllAlertsRead
      tags: [alerts]
      summary: Mark the latest alert history as read for the current account
      responses:
        "204":
          description: Alerts marked as read
  /alerts/{alertId}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark one alert as read for the current account
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "204":
          description: Alert marked as read
        "400":
          description: Invalid alert ID
        "404":
          description: Alert record not found
  /alerts/{alertId}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      summary: Acknowledge one alert for the current account
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "204":
          description: Alert acknowledged
        "400":
          description: Invalid alert ID
        "404":
          description: Alert record not found
  /alerts/push-capability:
    get:
      operationId: getPushCapability
      tags: [alerts]
      summary: Get Web Push capability without exposing VAPID private material
      responses:
        "200":
          description: Push capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushCapability"
  /alerts/push-subscriptions:
    post:
      operationId: createPushSubscription
      tags: [alerts]
      summary: Save or reactivate a Web Push subscription for the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "204":
          description: Subscription saved
  /alerts/push-subscriptions/{subscriptionId}:
    delete:
      operationId: deletePushSubscription
      tags: [alerts]
      summary: Deactivate one owned Push subscription
      parameters:
        - in: path
          name: subscriptionId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Subscription deactivated
  /alerts/test-notification:
    post:
      operationId: sendAlertTestNotification
      tags: [alerts]
      summary: Send a non-market test Push notification to the current account
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestNotificationResponse"
components:
  parameters:
    AlertId:
      in: path
      name: alertId
      required: true
      schema:
        type: string
  schemas:
    AlertSeverity:
      type: string
      enum: [info, watch, alert, critical]
    VerifiedAlphaAlert:
      type: object
      required: [id, eventKey, symbol, severity, triggerReason, detectionState, confirmationStatus, alphaScore, confidence, preBreakoutState, satisfiedEvidence, missingEvidence, generatedAt, readAt, acknowledgedAt]
      properties:
        id: { type: string }
        eventKey: { type: string }
        symbol: { type: string }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        triggerReason: { type: string }
        detectionState: { type: string }
        confirmationStatus: { type: string }
        alphaScore: { type: number }
        alphaVelocity30s: { type: [number, "null"] }
        confidence: { type: number }
        triggerPrice: { type: [number, "null"] }
        preBreakoutState: { type: string }
        satisfiedEvidence:
          type: array
          items: { type: string }
        missingEvidence:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        acknowledgedAt: { type: [string, "null"], format: date-time }
    AlertsListResponse:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items: { $ref: "#/components/schemas/VerifiedAlphaAlert" }
    AlertSettings:
      type: object
      required: [browserNotificationsEnabled, inAppNotificationsEnabled, minimumSeverity, quietHoursStart, quietHoursEnd, timezone, globalOptOut]
      properties:
        browserNotificationsEnabled: { type: boolean }
        inAppNotificationsEnabled: { type: boolean }
        minimumSeverity: { $ref: "#/components/schemas/AlertSeverity" }
        quietHoursStart: { type: [string, "null"] }
        quietHoursEnd: { type: [string, "null"] }
        timezone: { type: [string, "null"] }
        globalOptOut: { type: boolean }
    UpdateAlertSettingsRequest:
      type: object
      required: [browserNotificationsEnabled, minimumTier, notifyOnWatch]
      properties:
        browserNotificationsEnabled: { type: boolean }
        minimumTier:
          type: string
          enum: [confirmed, pre_breakout, accelerating, watch]
        notifyOnWatch: { type: boolean }
    PushCapability:
      oneOf:
        - type: object
          required: [available, publicKey]
          properties:
            available: { const: true }
            publicKey: { type: string }
        - type: object
          required: [available, reason]
          properties:
            available: { const: false }
            reason: { type: string }
    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        deviceLabel: { type: string, maxLength: 120 }
    TestNotificationResponse:
      type: object
      required: [status, attempted]
      properties:
        status:
          type: string
          enum: [sent, unavailable, no_subscriptions, failed]
        attempted: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RadarConnectionState:
      type: string
      enum: [not_configured, connecting, connected, streaming, error, stopped]
    MarketFeedState:
      type: string
      enum: [streaming, stale, offline]
    RadarReconnectState:
      type: string
      enum: [idle, scheduled, reconnecting, exhausted]
    MarketUniverseRefreshState:
      type: string
      enum: [idle, refreshing, ready, degraded, unavailable]
    ReferenceFreshness:
      type: string
      enum: [fresh, stale, missing]
    ReferenceDataQuality:
      type: string
      enum: [good, degraded, unavailable]
    SecurityLifecycleStatus:
      type: string
      enum: [active, halted, inactive, delisted, unknown]
    SecurityEligibility:
      type: string
      enum: [eligible, ineligible]
    NormalizedSecurityType:
      type: string
      enum: [common_stock, fund, adr, preferred, warrant, unit, right, other, unknown]
    SecurityReference:
      type: object
      properties:
        symbol:
          type: string
        providerSymbol:
          type: string
        instrumentId:
          type: [string, "null"]
        listingId:
          type: [string, "null"]
        issuerName:
          type: [string, "null"]
        listingExchange:
          type: [string, "null"]
        primaryExchange:
          type: [string, "null"]
        securityType:
          $ref: "#/components/schemas/NormalizedSecurityType"
        providerSecurityType:
          type: [string, "null"]
        instrumentClass:
          type: [string, "null"]
        lifecycleStatus:
          $ref: "#/components/schemas/SecurityLifecycleStatus"
        lifecycleReason:
          type: string
        eligibility:
          $ref: "#/components/schemas/SecurityEligibility"
        eligibilityReasons:
          type: array
          items:
            type: string
        sector:
          type: [string, "null"]
        industryGroup:
          type: [string, "null"]
        industry:
          type: [string, "null"]
        classificationSource:
          type: [string, "null"]
        referenceUpdatedAt:
          type: string
          format: date-time
      required:
        - symbol
        - providerSymbol
        - instrumentId
        - listingId
        - issuerName
        - listingExchange
        - primaryExchange
        - securityType
        - providerSecurityType
        - instrumentClass
        - lifecycleStatus
        - lifecycleReason
        - eligibility
        - eligibilityReasons
        - sector
        - industryGroup
        - industry
        - classificationSource
        - referenceUpdatedAt
    MarketUniverseLifecycleCounts:
      type: object
      properties:
        active:
          type: number
          minimum: 0
        halted:
          type: number
          minimum: 0
        inactive:
          type: number
          minimum: 0
        delisted:
          type: number
          minimum: 0
        unknown:
          type: number
          minimum: 0
      required: [active, halted, inactive, delisted, unknown]
    MarketUniverseSummary:
      type: object
      properties:
        provider:
          type: string
          enum: [Databento]
        dataset:
          type: string
        source:
          type: string
        deliveryMode:
          type: string
          enum: [reference_only]
        refreshState:
          $ref: "#/components/schemas/MarketUniverseRefreshState"
        lastAttemptAt:
          type: ["string", "null"]
          format: date-time
        refreshedAt:
          type: ["string", "null"]
          format: date-time
        sourceTimestamp:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/ReferenceFreshness"
        dataQuality:
          $ref: "#/components/schemas/ReferenceDataQuality"
        reason:
          type: string
        totalCount:
          type: number
          minimum: 0
        eligibleCount:
          type: number
          minimum: 0
        ineligibleCount:
          type: number
          minimum: 0
        commonEquityVerifiedCount:
          type: number
          minimum: 0
        classificationCoverageCount:
          type: number
          minimum: 0
        lifecycleCounts:
          $ref: "#/components/schemas/MarketUniverseLifecycleCounts"
        eligibleSample:
          type: array
          items:
            type: string
      required:
        - provider
        - dataset
        - source
        - deliveryMode
        - refreshState
        - lastAttemptAt
        - refreshedAt
        - sourceTimestamp
        - expiresAt
        - freshness
        - dataQuality
        - reason
        - totalCount
        - eligibleCount
        - ineligibleCount
        - commonEquityVerifiedCount
        - classificationCoverageCount
        - lifecycleCounts
        - eligibleSample
    MarketUniverseResult:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/MarketUniverseSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityReference"
        total:
          type: number
          minimum: 0
        limit:
          type: number
          minimum: 1
        offset:
          type: number
          minimum: 0
      required: [summary, items, total, limit, offset]
    DatabentoAuthorizationState:
      type: string
      enum: [unavailable, unverified, available, blocked]
    FocusedScanState:
      type: string
      enum: [unavailable, blocked, ready, scanning]
    FocusedCandidateState:
      type: string
      enum: [admitted, rejected, cooling_down, evicted]
    FocusedScanAuthorization:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/DatabentoAuthorizationState"
        reason:
          type: string
        verifiedAt:
          type: [string, "null"]
          format: date-time
      required: [state, reason, verifiedAt]
    FocusedScanReference:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
        eligibleCount:
          type: number
          minimum: 0
        freshness:
          $ref: "#/components/schemas/ReferenceFreshness"
        dataQuality:
          $ref: "#/components/schemas/ReferenceDataQuality"
      required: [available, reason, eligibleCount, freshness, dataQuality]
    FocusedScanLeaderEvidence:
      type: object
      properties:
        available:
          type: boolean
        reason:
          type: string
      required: [available, reason]
    FocusedScanCapacity:
      type: object
      properties:
        maximum:
          type: number
          minimum: 1
        active:
          type: number
          minimum: 0
        available:
          type: number
          minimum: 0
      required: [maximum, active, available]
    FocusedScanActive:
      type: object
      properties:
        symbol:
          type: string
        admittedAt:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time
        independentEvidenceCount:
          type: number
          minimum: 0
        connectionState:
          $ref: "#/components/schemas/RadarConnectionState"
        marketFeedState:
          $ref: "#/components/schemas/MarketFeedState"
        dataFresh:
          type: boolean
        reason:
          type: string
      required:
        - symbol
        - admittedAt
        - observedAt
        - independentEvidenceCount
        - connectionState
        - marketFeedState
        - dataFresh
        - reason
    FocusedScanCandidate:
      type: object
      properties:
        symbol:
          type: string
        state:
          $ref: "#/components/schemas/FocusedCandidateState"
        reason:
          type: string
        observedAt:
          type: [string, "null"]
          format: date-time
        independentEvidenceCount:
          type: number
          minimum: 0
        updatedAt:
          type: string
          format: date-time
      required: [symbol, state, reason, observedAt, independentEvidenceCount, updatedAt]
    FocusedScanSnapshot:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/FocusedScanState"
        reason:
          type: string
        authorization:
          $ref: "#/components/schemas/FocusedScanAuthorization"
        reference:
          $ref: "#/components/schemas/FocusedScanReference"
        leaderEvidence:
          $ref: "#/components/schemas/FocusedScanLeaderEvidence"
        capacity:
          $ref: "#/components/schemas/FocusedScanCapacity"
        activeScans:
          type: array
          items:
            $ref: "#/components/schemas/FocusedScanActive"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/FocusedScanCandidate"
      required:
        - state
        - reason
        - authorization
        - reference
        - leaderEvidence
        - capacity
        - activeScans
        - candidates
    CatalystCategory:
      type: string
      enum: [company_news, earnings_guidance, fda_clinical_regulatory, partnership_order_ma, sec_filing]
    CatalystSourceAvailability:
      type: string
      enum: [unavailable, available, stale, blocked]
    CatalystFreshness:
      type: string
      enum: [fresh, delayed, stale, insufficient, missing]
    CatalystDataQuality:
      type: string
      enum: [good, degraded, unavailable]
    CatalystEventState:
      type: string
      enum: [unavailable, observed]
    OpportunityState:
      type: string
      enum: [WATCH, PRE-BREAKOUT, CONFIRMED]
    OpportunityFreshness:
      type: string
      enum: [fresh, stale, insufficient, missing]
    SectorConfirmationStatus:
      type: string
      enum: [confirmed, insufficient, unavailable]
    CatalystSourceStatus:
      type: object
      properties:
        category: { $ref: "#/components/schemas/CatalystCategory" }
        label: { type: string }
        availability: { $ref: "#/components/schemas/CatalystSourceAvailability" }
        authorized: { type: boolean }
        source: { type: [string, "null"] }
        freshness: { $ref: "#/components/schemas/CatalystFreshness" }
        dataQuality: { $ref: "#/components/schemas/CatalystDataQuality" }
        lastEventAt: { type: [string, "null"], format: date-time }
        reason: { type: string }
      required: [category, label, availability, authorized, source, freshness, dataQuality, lastEventAt, reason]
    CatalystEvent:
      type: object
      properties:
        id: { type: string }
        symbol: { type: string }
        category: { $ref: "#/components/schemas/CatalystCategory" }
        observedAt: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/CatalystFreshness" }
        source: { type: string }
        summary: { type: string }
        dataQuality: { $ref: "#/components/schemas/CatalystDataQuality" }
      required: [id, symbol, category, observedAt, freshness, source, summary, dataQuality]
    CatalystEvidence:
      type: object
      properties:
        key: { type: string }
        category:
          type: string
          enum: [catalyst, market_microstructure, confirmation]
        label: { type: string }
        satisfied: { type: boolean }
        independent: { type: boolean }
        freshness: { $ref: "#/components/schemas/CatalystFreshness" }
        source: { type: string }
        detail: { type: string }
      required: [key, category, label, satisfied, independent, freshness, source, detail]
    SectorConfirmation:
      type: object
      properties:
        status: { $ref: "#/components/schemas/SectorConfirmationStatus" }
        sector: { type: [string, "null"] }
        industry: { type: [string, "null"] }
        trustedClassification: { type: boolean }
        freshEligiblePeerCount: { type: number, minimum: 0 }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/CatalystEvidence" }
        missing:
          type: array
          items: { type: string }
        reason: { type: string }
      required: [status, sector, industry, trustedClassification, freshEligiblePeerCount, evidence, missing, reason]
    Opportunity:
      type: object
      properties:
        symbol: { type: string }
        eventTime: { type: [string, "null"], format: date-time }
        freshness: { $ref: "#/components/schemas/OpportunityFreshness" }
        catalystStatus: { $ref: "#/components/schemas/CatalystSourceAvailability" }
        evidenceCount: { type: number, minimum: 0 }
        evidenceChain:
          type: array
          items: { $ref: "#/components/schemas/CatalystEvidence" }
        state: { $ref: "#/components/schemas/OpportunityState" }
        marketState:
          type: string
          enum: [fresh, stale, insufficient, offline]
        sectorConfirmation: { $ref: "#/components/schemas/SectorConfirmation" }
        missingConfirmationItems:
          type: array
          items: { type: string }
        reason: { type: string }
      required: [symbol, eventTime, freshness, catalystStatus, evidenceCount, evidenceChain, state, marketState, sectorConfirmation, missingConfirmationItems, reason]
    CatalystRadarSnapshot:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        eventState: { $ref: "#/components/schemas/CatalystEventState" }
        sourceCount: { type: number, minimum: 0 }
        availableSourceCount: { type: number, minimum: 0 }
        sourceStatuses:
          type: array
          items: { $ref: "#/components/schemas/CatalystSourceStatus" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CatalystEvent" }
        reason: { type: string }
      required: [generatedAt, eventState, sourceCount, availableSourceCount, sourceStatuses, events, reason]
    OpportunityCenterSnapshot:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/Opportunity" }
        reason: { type: string }
      required: [generatedAt, opportunities, reason]
    RadarSignalFreshness:
      type: string
      enum: [fresh, delayed, stale, missing]
    RadarSignalDataQuality:
      type: string
      enum: [good, degraded, stale, missing]
    AlphaRadarSignalState:
      type: string
      enum: [Neutral, Watch, Breakout Setup]
