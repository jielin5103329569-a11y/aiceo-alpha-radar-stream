openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: Safe market data connection and stream status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /radar/status:
    get:
      operationId: getRadarStatus
      tags: [radar]
      summary: Get the current safe market-data stream status
      responses:
        "200":
          description: Current radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/connect:
    post:
      operationId: startRadarConnection
      tags: [radar]
      summary: Start the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/disconnect:
    post:
      operationId: stopRadarConnection
      tags: [radar]
      summary: Stop the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/events:
    get:
      operationId: streamRadarEvents
      tags: [radar]
      summary: Receive safe radar status updates as server-sent events
      responses:
        "200":
          description: Server-sent radar state updates
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RadarConnectionState:
      type: string
      enum: [not_configured, connecting, connected, streaming, error, stopped]
    RadarReconnectState:
      type: string
      enum: [idle, scheduled, reconnecting, exhausted]
    RadarSignalFreshness:
      type: string
      enum: [fresh, delayed, stale, missing]
    RadarSignalDataQuality:
      type: string
      enum: [good, degraded, stale, missing]
    AlphaRadarSignalState:
      type: string
      enum: [Neutral, Watch, Breakout Setup]
    RadarSignalMetric:
      type: object
      properties:
        value:
          type: [number, "null"]
        unit:
          type: string
        score:
          type: [number, "null"]
        observedAt:
          type: ["string", "null"]
          format: date-time
        freshnessMs:
          type: [number, "null"]
        freshness:
          $ref: "#/components/schemas/RadarSignalFreshness"
        available:
          type: boolean
        referenceValue:
          type: [number, "null"]
        referenceLabel:
          type: [string, "null"]
        source:
          type: string
      required:
        - value
        - unit
        - score
        - observedAt
        - freshnessMs
        - freshness
        - available
        - referenceValue
        - referenceLabel
        - source
    AlphaRadarSnapshot:
      type: object
      properties:
        score:
          type: number
        status:
          $ref: "#/components/schemas/AlphaRadarSignalState"
        confidence:
          type: number
        dataQuality:
          $ref: "#/components/schemas/RadarSignalDataQuality"
        generatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        momentum:
          $ref: "#/components/schemas/RadarSignalMetric"
        spread:
          $ref: "#/components/schemas/RadarSignalMetric"
        volumeIntensity:
          $ref: "#/components/schemas/RadarSignalMetric"
        orderFlowPressure:
          $ref: "#/components/schemas/RadarSignalMetric"
        unusualActivity:
          allOf:
            - $ref: "#/components/schemas/RadarSignalMetric"
            - type: object
              properties:
                detected:
                  type: boolean
              required: [detected]
      required:
        - score
        - status
        - confidence
        - dataQuality
        - generatedAt
        - warnings
        - momentum
        - spread
        - volumeIntensity
        - orderFlowPressure
        - unusualActivity
    RadarMarketSnapshot:
      type: object
      properties:
        latestPrice:
          type: [number, "null"]
        bidPrice:
          type: [number, "null"]
        askPrice:
          type: [number, "null"]
        bidSize:
          type: [number, "null"]
        askSize:
          type: [number, "null"]
        lastTradeSize:
          type: [number, "null"]
        sessionVolume:
          type: [number, "null"]
        lastTradeAt:
          type: ["string", "null"]
          format: date-time
      required:
        - latestPrice
        - bidPrice
        - askPrice
        - bidSize
        - askSize
        - lastTradeSize
        - sessionVolume
        - lastTradeAt
    RadarTrade:
      type: object
      properties:
        price:
          type: number
        size:
          type: number
        timestamp:
          type: string
          format: date-time
        side:
          type: [string, "null"]
      required: [price, size, timestamp, side]
    RadarFreshness:
      type: string
      enum: [fresh, stale, insufficient, quiet]
    RadarSignal:
      type: object
      properties:
        score:
          type: [number, "null"]
        dataTimestamp:
          type: ["string", "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/RadarFreshness"
        detail:
          type: string
      required: [score, dataTimestamp, freshness, detail]
    RadarMomentumSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            changePercent:
              type: [number, "null"]
          required: [changePercent]
    RadarVolumeSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            recentVolume:
              type: [number, "null"]
            baselineVolume:
              type: [number, "null"]
            ratio:
              type: [number, "null"]
          required: [recentVolume, baselineVolume, ratio]
    RadarPressureSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            buyVolume:
              type: [number, "null"]
            sellVolume:
              type: [number, "null"]
            classifiedTrades:
              type: number
          required: [buyVolume, sellVolume, classifiedTrades]
    RadarSpreadSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            spread:
              type: [number, "null"]
            spreadBps:
              type: [number, "null"]
          required: [spread, spreadBps]
    RadarActivityFlag:
      type: object
      properties:
        type:
          type: string
          enum: [elevated_volume, elevated_trades, wide_spread, unbalanced_pressure, quiet]
        label:
          type: string
        detail:
          type: string
      required: [type, label, detail]
    RadarSnapshot:
      type: object
      properties:
        score:
          type: [number, "null"]
        status:
          type: string
          enum: [neutral, watch, breakout_setup]
        dataTimestamp:
          type: ["string", "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/RadarFreshness"
        sampleCount:
          type: number
        windowSeconds:
          type: number
        momentum:
          $ref: "#/components/schemas/RadarMomentumSignal"
        volumeIntensity:
          $ref: "#/components/schemas/RadarVolumeSignal"
        pressure:
          $ref: "#/components/schemas/RadarPressureSignal"
        spread:
          $ref: "#/components/schemas/RadarSpreadSignal"
        activityFlags:
          type: array
          items:
            $ref: "#/components/schemas/RadarActivityFlag"
      required:
        - score
        - status
        - dataTimestamp
        - freshness
        - sampleCount
        - windowSeconds
        - momentum
        - volumeIntensity
        - pressure
        - spread
        - activityFlags
    RadarStream:
      type: object
      properties:
        schema:
          type: string
          enum: [mbp-1, ohlcv-1s]
        state:
          type: string
          enum: [waiting, receiving, error]
        eventCount:
          type: number
        lastEventAt:
          type: ["string", "null"]
          format: date-time
      required: [schema, state, eventCount, lastEventAt]
    RadarStatus:
      type: object
      properties:
        configured:
          type: boolean
        connectionState:
          $ref: "#/components/schemas/RadarConnectionState"
        provider:
          type: string
        dataset:
          type: string
        symbol:
          type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        lastUpdatedAt:
          type: ["string", "null"]
          format: date-time
        lastHeartbeatAt:
          type: ["string", "null"]
          format: date-time
        reconnectState:
          $ref: "#/components/schemas/RadarReconnectState"
        reconnectAttempt:
          type: number
        nextReconnectAt:
          type: ["string", "null"]
          format: date-time
        alphaRadar:
          $ref: "#/components/schemas/AlphaRadarSnapshot"
        error:
          type: ["string", "null"]
        market:
          $ref: "#/components/schemas/RadarMarketSnapshot"
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/RadarTrade"
        radar:
          $ref: "#/components/schemas/RadarSnapshot"
        streams:
          type: array
          items:
            $ref: "#/components/schemas/RadarStream"
      required:
        - configured
        - connectionState
        - provider
        - dataset
        - symbol
        - startedAt
        - lastUpdatedAt
        - lastHeartbeatAt
        - reconnectState
        - reconnectAttempt
        - nextReconnectAt
        - alphaRadar
        - error
        - market
        - recentTrades
        - radar
        - streams
