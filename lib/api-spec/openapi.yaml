openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: Safe market data connection and stream status
  - name: alerts
    description: Account-scoped verified Alpha alerts and notification settings
  - name: research-sidecar
    description: Read-only Alex/Moonvest and Serenity research observations; never production decision data
  - name: aiceo
    description: ARCH-001 isolated AICEO control plane with restricted development-only Grok authority
paths:
  /aiceo/self-check:
    get:
      operationId: getAiceoSelfCheck
      tags: [aiceo]
      responses:
        "200": { description: ARCH-001 self-check, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoSelfCheck" } } } }
  /aiceo/status:
    get:
      operationId: getAiceoStatus
      tags: [aiceo]
      responses:
        "200": { description: Control-plane status, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoStatus" } } } }
        "503": { description: Durable control plane degraded }
  /aiceo/history:
    get:
      operationId: getAiceoHistory
      tags: [aiceo]
      responses:
        "200": { description: Append-only audit history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AiceoAuditEvent" } } } } }
  /aiceo/continuity:
    get:
      operationId: getAiceoContinuity
      tags: [aiceo]
      security: [{ clerk: [] }]
      responses:
        "200": { description: Persistent Continuity Layer snapshot; persistent state is authoritative, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoContinuitySnapshot" } } } }
        "403": { description: Exactly one current AICEO role required }
  /aiceo/continuity/resume:
    post:
      operationId: resumeAiceoContinuity
      tags: [aiceo]
      security: [{ clerk: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoContinuityResumeInput" } } } }
      responses:
        "200": { description: Resume directive derived from persistent state, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoContinuitySnapshot" } } } }
  /aiceo/continuity/state:
    put:
      operationId: recordAiceoContinuityState
      tags: [aiceo]
      security: [{ clerk: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoContinuityStateInput" } } } }
      responses:
        "200": { description: Durable supervisor state recorded with append-only HMAC evidence }
        "403": { description: Exclusive operator role required }
        "409": { description: "Serial, authority, state-transition, or safety control rejected the update" }
  /aiceo/tasks:
    post:
      operationId: submitAiceoTask
      tags: [aiceo]
      security: [{ clerk: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoTaskInput" } } } }
      responses:
        "200": { description: Task submitted, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoTask" } } } }
        "401": { description: Authentication required }
  /aiceo/governance-acceptance:
    get:
      operationId: getAiceoGovernanceAcceptance
      tags: [aiceo]
      security: [{ clerk: [] }]
      responses:
        "200": { description: Role-scoped Development governance acceptance state, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoGovernanceAcceptance" } } } }
        "401": { description: Authentication required }
        "403": { description: Exactly one current AICEO role required }
  /aiceo/governance-acceptance/test-task:
    post:
      operationId: createAiceoGovernanceAcceptanceTask
      tags: [aiceo]
      security: [{ clerk: [] }]
      responses:
        "200": { description: Fixed no-side-effect Development governance acceptance task, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoTask" } } } }
        "401": { description: Authentication required }
        "403": { description: Exclusive operator role required }
  /aiceo/tasks/{id}/execute:
    post:
      operationId: executeApprovedAiceoTask
      tags: [aiceo]
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Provider result settled into VALIDATING or an incident state, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoTask" } } } }
        "401": { description: Authentication required }
        "409": { description: Execution gate rejected the task }
  /aiceo/tasks/{id}/owner-governance-approve:
    post:
      operationId: approveAiceoOwnerGovernance
      tags: [aiceo]
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Immutable independent Owner Governance Approval recorded, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoOwnerGovernanceApprovalResult" } } } }
        "401": { description: Authentication required }
        "403": { description: Exclusive AICEO Owner role required }
        "409": { description: "Governance classification, independence, or immutability gate rejected approval" }
  /aiceo/tasks/{id}/validate:
    post:
      operationId: validateAiceoTask
      tags: [aiceo]
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Explicit validation completion } }
  /aiceo/tasks/{id}/cancel:
    post:
      operationId: cancelAiceoTask
      tags: [aiceo]
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Task cancelled } }
  /aiceo/tasks/{id}/diagnose:
    post:
      operationId: diagnoseAiceoTask
      tags: [aiceo]
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoDiagnosisInput" } } } }
      responses: { "200": { description: Incident diagnosed without replay } }
  /aiceo/operator/kill-switch:
    post:
      operationId: setAiceoKillSwitch
      tags: [aiceo]
      security: [{ clerk: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AiceoKillSwitchInput" } } } }
      responses: { "200": { description: Kill switch state } }
  /aiceo/operator/recovery-ack:
    post:
      operationId: acknowledgeAiceoRecovery
      tags: [aiceo]
      security: [{ clerk: [] }]
      responses: { "200": { description: Recovery acknowledged } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /radar/status:
    get:
      operationId: getRadarStatus
      tags: [radar]
      summary: Get the current safe market-data stream status
      responses:
        "200":
          description: Current radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /research-sidecar:
    get:
      operationId: getResearchSidecar
      tags: [research-sidecar]
      summary: Read the isolated research sidecar snapshot
      description: >
        Read-only research observations from the Alex/Moonvest and Serenity
        source lanes. This sidecar has no Alpha Radar, ranking, alert, or
        production scanner authority.
      responses:
        "200":
          description: Research sidecar snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarSnapshot"
        "503":
          description: Research sidecar storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarSnapshot"
  /research-sidecar/snapshot:
    get:
      operationId: getResearchSidecarSnapshot
      tags: [research-sidecar]
      summary: Read the isolated research sidecar snapshot
      responses:
        "200":
          description: Research sidecar snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarSnapshot"
        "503":
          description: Research sidecar storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarSnapshot"
  /research-sidecar/history:
    get:
      operationId: getResearchSidecarHistory
      tags: [research-sidecar]
      summary: Read append-only research sidecar history
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Append-only observation and resonance history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarHistory"
        "503":
          description: Research sidecar storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarHistory"
  /research-sidecar/observations:
    post:
      operationId: appendResearchObservation
      tags: [research-sidecar]
      summary: Append one authenticated research-only observation
      description: >
        Appends an immutable observation to exactly one source lane. Event
        identity, record hash, version, id, and created time are server-owned.
        US watch admission is research-only and is granted only from the
        supplied identity metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchObservationInput"
      responses:
        "201":
          description: Observation appended and any opposite-lane resonances persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchObservationAppendResponse"
        "200":
          description: Identical observation was already present (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchObservationAppendResponse"
        "400":
          description: Invalid research observation
        "401":
          description: Authentication required
        "409":
          description: Event identity already exists with conflicting content
        "503":
          description: Research sidecar storage is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchSidecarUnavailable"
  /radar/engineering-governance:
    get:
      operationId: getEngineeringGovernance
      tags: [radar]
      summary: Read the engineering-governance projection
      description: >
        Read-only engineering governance. It never reads or changes the Replit
        Task Board, agent leases, scoring, live scan cadence, Alert delivery,
        or Shadow Learning eligibility.
      responses:
        "200":
          description: Current engineering-governance projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineeringGovernanceSnapshot"
  /radar/lifeline:
    get:
      operationId: getBackendLifeline
      tags: [radar]
      summary: Read the server-owned backend lifeline health
      description: >
        Read-only backend ownership, transport, heartbeat, verified-market-event,
        scheduler, recovery, alert-delivery, and persistence-boundary health.
        Heartbeats and listener health are never represented as market evidence.
      responses:
        "200":
          description: Current server-owned backend lifeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendLifelineSnapshot"
  /radar/runtime-supervisor:
    get:
      operationId: getRuntimeSupervisor
      tags: [radar]
      summary: Read the server-owned runtime supervisor
      description: >
        Read-only operational supervision. It cannot read or control Replit
        background task agents, Planning sessions, Build gates, or account-level
        concurrency, and it never grants market or Alert authority.
      responses:
        "200":
          description: Current runtime supervisor snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSupervisorSnapshot"
  /radar/runtime-incidents:
    get:
      operationId: getRuntimeSupervisorIncidents
      tags: [radar]
      summary: List persistent runtime-supervisor incidents
      parameters:
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent deduplicated operational incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeSupervisorIncidentRecord"
        "400":
          description: The requested incident limit is outside the supported range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSupervisorError"
        "503":
          description: Persistent operational incident storage is temporarily unavailable. Market and Alert workflows are unaffected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSupervisorError"
  /radar/diagnostics:
    get:
      operationId: getDiagnostics
      tags: [radar]
      summary: Read the unified Alpha Radar Diagnostics Center projection
      description: >
        Read-only diagnostics that classify operational evidence without changing
        market freshness, scoring, candidate eligibility, Alert authority,
        configuration, external permissions, or governance policy.
      responses:
        "200":
          description: Current diagnostic health, evidence, reports, timeline, validation, and knowledge base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsSnapshot"
  /radar/events:
    get:
      operationId: streamRadarEvents
      tags: [radar]
      summary: Receive safe radar status updates as server-sent events
      responses:
        "200":
          description: Server-sent radar state updates
          content:
            text/event-stream:
              schema:
                type: string
  /radar/universe:
    get:
      operationId: getMarketUniverse
      tags: [radar]
      summary: Query the low-frequency U.S. equity reference universe
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 64
        - in: query
          name: eligibility
          schema:
            type: string
            enum: [eligible, ineligible, all]
            default: eligible
        - in: query
          name: lifecycle
          schema:
            anyOf:
              - $ref: "#/components/schemas/SecurityLifecycleStatus"
              - type: string
                enum: [all]
            default: all
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Bounded reference-universe results and quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketUniverseResult"
  /radar/ai-industry-pool:
    get:
      operationId: getAiIndustryPool
      tags: [radar]
      summary: Get the read-only, dynamically maintained AI industry discovery pool
      responses:
        "200":
          description: Taxonomy lifecycle, bounded reference-enrichment capacity, and withheld states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiIndustryPoolSnapshot"
  /radar/ai-industry-pool/history:
    get:
      operationId: getAiIndustryPoolHistory
      tags: [radar]
      summary: Get append-only AI industry pool membership and enrichment lifecycle history
      responses:
        "200":
          description: Bounded, newest-first audit events for automated pool lifecycle decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiIndustryPoolHistoryEvent"
  /radar/focused-scans:
    get:
      operationId: getFocusedScanStatus
      tags: [radar]
      summary: Get bounded focused-scan routing status and capability gates
      responses:
        "200":
          description: Read-only focused-scan capacity, authorization, reference, and candidate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusedScanSnapshot"
  /radar/catalysts:
    get:
      operationId: getCatalystRadar
      tags: [radar]
      summary: Get source availability and observed catalyst events
      responses:
        "200":
          description: Provider-neutral catalyst source status; unavailable sources never emit synthetic events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalystRadarSnapshot"
  /radar/opportunities:
    get:
      operationId: getOpportunityCenter
      tags: [radar]
      summary: Get evidence-led market opportunities and missing confirmation gates
      responses:
        "200":
          description: Current opportunity evidence chains for the protected live universe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityCenterSnapshot"
  /radar/validation:
    get:
      operationId: getSignalValidation
      tags: [radar]
      summary: Get immutable signal validation metrics and recent records
      parameters:
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/ValidationSignalState"
        - in: query
          name: sector
          schema:
            type: string
            maxLength: 120
        - in: query
          name: signalType
          schema:
            $ref: "#/components/schemas/ValidationSignalType"
        - in: query
          name: horizonDays
          schema:
            type: number
            enum: [1, 3, 5, 10, 20]
            default: 5
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Persistent trigger-time records and future-only outcome metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalValidationDashboard"
  /radar/validation/signals/{signalId}:
    get:
      operationId: getSignalValidationAudit
      tags: [radar]
      summary: Audit one immutable signal and its outcome checkpoints
      parameters:
        - in: path
          name: signalId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Full trigger-time evidence chain and checkpoint history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalValidationAudit"
  /radar/shadow-learning:
    get:
      operationId: getShadowLearningValidation
      tags: [radar]
      summary: Get server-owned Shadow Learning comparison and read-only promotion recommendation
      parameters:
        - in: query
          name: strategyVersion
          schema:
            type: string
            maxLength: 160
        - in: query
          name: signalType
          schema:
            type: string
            maxLength: 80
        - in: query
          name: scanWindow
          schema:
            type: string
            maxLength: 80
        - in: query
          name: sector
          schema:
            type: string
            maxLength: 120
        - in: query
          name: horizonDays
          schema:
            type: number
            enum: [1, 3, 5, 10, 20]
            default: 5
      responses:
        "200":
          description: Immutable shadow validation metrics and a server-owned manual-review recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShadowLearningDashboard"
  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List verified Alpha alerts with the current account's read state
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Account-scoped alert history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsListResponse"
  /alerts/settings:
    get:
      operationId: getAlertSettings
      tags: [alerts]
      summary: Get account-scoped notification settings
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
    put:
      operationId: updateAlertSettings
      tags: [alerts]
      summary: Update account-scoped notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAlertSettingsRequest"
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertSettings"
  /alerts/read-all:
    post:
      operationId: markAllAlertsRead
      tags: [alerts]
      summary: Mark the latest alert history as read for the current account
      responses:
        "204":
          description: Alerts marked as read
  /alerts/{alertId}/read:
    post:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark one alert as read for the current account
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "204":
          description: Alert marked as read
        "400":
          description: Invalid alert ID
        "404":
          description: Alert record not found
  /alerts/{alertId}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      summary: Acknowledge one alert for the current account
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "204":
          description: Alert acknowledged
        "400":
          description: Invalid alert ID
        "404":
          description: Alert record not found
  /alerts/push-capability:
    get:
      operationId: getPushCapability
      tags: [alerts]
      summary: Get Web Push capability without exposing VAPID private material
      responses:
        "200":
          description: Push capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushCapability"
  /alerts/push-status:
    get:
      operationId: getPushSubscriptionStatus
      tags: [alerts]
      summary: Get the current account's non-sensitive Web Push readiness state
      responses:
        "200":
          description: Push readiness and active subscription count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionStatus"
  /alerts/push-subscriptions:
    post:
      operationId: createPushSubscription
      tags: [alerts]
      summary: Save or reactivate a Web Push subscription for the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "204":
          description: Subscription saved
    delete:
      operationId: deleteCurrentPushSubscription
      tags: [alerts]
      summary: Deactivate the current browser subscription by its endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionEndpoint"
      responses:
        "204":
          description: Current browser subscription deactivated
  /alerts/push-subscriptions/{subscriptionId}:
    delete:
      operationId: deletePushSubscription
      tags: [alerts]
      summary: Deactivate one owned Push subscription
      parameters:
        - in: path
          name: subscriptionId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Subscription deactivated
  /alerts/test-notification:
    post:
      operationId: sendAlertTestNotification
      tags: [alerts]
      summary: Send a non-market test Push notification to the current account
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestNotificationResponse"
components:
  parameters:
    AlertId:
      in: path
      name: alertId
      required: true
      schema:
        type: string
  schemas:
    AiceoContinuityResumeInput:
      type: object
      additionalProperties: false
      required: [alias]
      properties:
        alias: { type: string, minLength: 1, maxLength: 120 }
    AiceoContinuityStateInput:
      type: object
      additionalProperties: false
      required: [state, currentState, decisionRuleRegistry, entityRegistry, aliasDictionary, evidencePointers, resumeNode]
      properties:
        state: { type: string, enum: [RUNNING, PAUSED, FAILED, COMPLETED, OWNER_GATE] }
        currentState: { type: object, additionalProperties: true }
        decisionRuleRegistry: { type: array, items: { type: object, additionalProperties: true } }
        entityRegistry: { type: array, items: { type: object, additionalProperties: true } }
        aliasDictionary: { type: object, additionalProperties: true }
        evidencePointers: { type: array, items: { type: object, additionalProperties: true } }
        resumeNode: { type: object, additionalProperties: true }
        failureReason: { type: [string, "null"] }
        recoveryStrategy: { type: [string, "null"] }
        ownerGateReason: { type: [string, "null"] }
    AiceoContinuitySnapshot:
      type: object
      required: [version, truthSource, memoryPolicy, project, state, events, productionAuthority]
      properties:
        version: { type: string, const: CONTINUITY-001 }
        truthSource: { type: string, const: persistent_state }
        memoryPolicy: { type: string }
        role: { type: string, enum: [aiceo_owner, aiceo_operator, aiceo_validator] }
        project: { type: object, additionalProperties: true }
        state: { type: object, additionalProperties: true }
        events: { type: array, items: { type: object, additionalProperties: true } }
        resume: { type: object, additionalProperties: true }
        productionAuthority: { type: boolean, const: false }
    AiceoTaskInput:
      type: object
      required: [action, resource, governance]
      properties:
        action: { type: string, minLength: 1, maxLength: 120 }
        resource: { type: string, minLength: 1, maxLength: 180 }
        governance:
          type: object
          required: [classification, redLines]
          properties:
            classification: { type: string, enum: [ordinary_technical, owner_protection] }
            redLines:
              type: array
              maxItems: 3
