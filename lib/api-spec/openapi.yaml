openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: Safe market data connection and stream status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /radar/status:
    get:
      operationId: getRadarStatus
      tags: [radar]
      summary: Get the current safe market-data stream status
      responses:
        "200":
          description: Current radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/connect:
    post:
      operationId: startRadarConnection
      tags: [radar]
      summary: Start the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/disconnect:
    post:
      operationId: stopRadarConnection
      tags: [radar]
      summary: Stop the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/events:
    get:
      operationId: streamRadarEvents
      tags: [radar]
      summary: Receive safe radar status updates as server-sent events
      responses:
        "200":
          description: Server-sent radar state updates
          content:
            text/event-stream:
              schema:
                type: string
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RadarConnectionState:
      type: string
      enum: [not_configured, connecting, connected, streaming, error, stopped]
    MarketFeedState:
      type: string
      enum: [streaming, stale, offline]
    RadarReconnectState:
      type: string
      enum: [idle, scheduled, reconnecting, exhausted]
    RadarSignalFreshness:
      type: string
      enum: [fresh, delayed, stale, missing]
    RadarSignalDataQuality:
      type: string
      enum: [good, degraded, stale, missing]
    AlphaRadarSignalState:
      type: string
      enum: [Neutral, Watch, Breakout Setup]
    AlphaRadarScoreState:
      type: string
      enum: [available, stale, insufficient]
    AlphaRadarDiagnostics:
      type: object
      properties:
        fresh_quotes:
          type: number
          minimum: 0
        fresh_trades:
          type: number
          minimum: 0
        fresh_prices:
          type: number
          minimum: 0
        fresh_volume:
          type: number
          minimum: 0
        valid_window_age:
          type: [number, "null"]
          description: Age in seconds of the active, real-observation scoring window.
        scoring_gate_reason:
          type: string
      required:
        - fresh_quotes
        - fresh_trades
        - fresh_prices
        - fresh_volume
        - valid_window_age
        - scoring_gate_reason
    AlphaRadarScanMetadata:
      type: object
      properties:
        lastScannedAt:
          type: string
          format: date-time
        scanIntervalMs:
          type: number
        scanMode:
          type: string
          enum: [normal, pre_open, opening]
        triggerReason:
          type: string
        eventTriggered:
          type: boolean
      required:
        - lastScannedAt
        - scanIntervalMs
        - scanMode
        - triggerReason
        - eventTriggered
    AlphaVelocity:
      type: object
      properties:
        delta30s:
          type: [number, "null"]
        delta60s:
          type: [number, "null"]
        rate30s:
          type: [number, "null"]
          description: Alpha score points per minute using the latest valid 30-second comparison.
        rate60s:
          type: [number, "null"]
          description: Alpha score points per minute using the latest valid 60-second comparison.
      required: [delta30s, delta60s, rate30s, rate60s]
    AlphaChangeIndicators:
      type: object
      properties:
        momentumAcceleration:
          type: [number, "null"]
          description: Momentum score-point change per minute between valid scans.
        volumeAcceleration:
          type: [number, "null"]
          description: Volume intensity score-point change per minute between valid scans.
        orderFlowShift:
          type: [number, "null"]
          description: Order-flow score-point change per minute between valid scans.
        spreadTightening:
          type: [number, "null"]
          description: Spread score-point change per minute; positive values indicate tightening.
      required: [momentumAcceleration, volumeAcceleration, orderFlowShift, spreadTightening]
    PreBreakoutDetectionState:
      type: string
      enum: [unavailable, watch, accelerating, pre_breakout, confirmed]
    PreBreakoutConfirmationStatus:
      type: string
      enum: [unavailable, pending, confirmed, rejected]
    PreBreakoutConfirmationEvidenceKey:
      type: string
      enum:
        - price_momentum
        - volume_acceleration
        - order_flow_pressure
        - spread_tightening
        - alpha_velocity
        - score_strength
        - trajectory_persistence
    PreBreakoutConfirmationEvidence:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/PreBreakoutConfirmationEvidenceKey"
        label:
          type: string
        satisfied:
          type: boolean
        detail:
          type: string
      required: [key, label, satisfied, detail]
    PreBreakoutConfirmation:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PreBreakoutConfirmationEvidence"
        satisfiedEvidence:
          type: array
          items:
            type: string
        missingEvidence:
          type: array
          items:
            type: string
        persistenceScans:
          type: number
          minimum: 0
        requiredPersistenceScans:
          type: number
          minimum: 1
        evaluatedAt:
          type: string
          format: date-time
        reason:
          type: string
      required:
        - status
        - evidence
        - satisfiedEvidence
        - missingEvidence
        - persistenceScans
        - requiredPersistenceScans
        - evaluatedAt
        - reason
    PreBreakoutDetection:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        evidenceCount:
          type: number
          minimum: 0
        velocityGateSatisfied:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        deteriorationReasons:
          type: array
          items:
            type: string
        transitionEvidenceCount:
          type: number
          minimum: 0
        transitionReasons:
          type: array
          items:
            type: string
        lastTransitionAt:
          type: ["string", "null"]
          format: date-time
        lastEvaluatedAt:
          type: string
          format: date-time
        dataFresh:
          type: boolean
        cooldownRemainingMs:
          type: [number, "null"]
          minimum: 0
        confirmation:
          $ref: "#/components/schemas/PreBreakoutConfirmation"
      required:
        - state
        - evidenceCount
        - velocityGateSatisfied
        - reasons
        - deteriorationReasons
        - transitionEvidenceCount
        - transitionReasons
        - lastTransitionAt
        - lastEvaluatedAt
        - dataFresh
        - cooldownRemainingMs
        - confirmation
    RadarSignalMetric:
      type: object
      properties:
        value:
          type: [number, "null"]
        unit:
          type: string
        score:
          type: [number, "null"]
        observedAt:
          type: ["string", "null"]
          format: date-time
        freshnessMs:
          type: [number, "null"]
        freshness:
          $ref: "#/components/schemas/RadarSignalFreshness"
        available:
          type: boolean
        scoreEligible:
          type: boolean
        referenceValue:
          type: [number, "null"]
        referenceLabel:
          type: [string, "null"]
        source:
          type: string
      required:
        - value
        - unit
        - score
        - observedAt
        - freshnessMs
        - freshness
        - available
        - scoreEligible
        - referenceValue
        - referenceLabel
        - source
    AlphaRadarSnapshot:
      type: object
      properties:
        score:
          type: [number, "null"]
        status:
          anyOf:
            - $ref: "#/components/schemas/AlphaRadarSignalState"
            - type: "null"
        scoreState:
          $ref: "#/components/schemas/AlphaRadarScoreState"
        confidence:
          type: number
        dataQuality:
          $ref: "#/components/schemas/RadarSignalDataQuality"
        generatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        diagnostics:
          $ref: "#/components/schemas/AlphaRadarDiagnostics"
        scan:
          $ref: "#/components/schemas/AlphaRadarScanMetadata"
        alphaVelocity:
          $ref: "#/components/schemas/AlphaVelocity"
        changeIndicators:
          $ref: "#/components/schemas/AlphaChangeIndicators"
        preBreakoutWatch:
          type: boolean
        preBreakout:
          $ref: "#/components/schemas/PreBreakoutDetection"
        momentum:
          $ref: "#/components/schemas/RadarSignalMetric"
        spread:
          $ref: "#/components/schemas/RadarSignalMetric"
        volumeIntensity:
          $ref: "#/components/schemas/RadarSignalMetric"
        orderFlowPressure:
          $ref: "#/components/schemas/RadarSignalMetric"
        unusualActivity:
          allOf:
            - $ref: "#/components/schemas/RadarSignalMetric"
            - type: object
              properties:
                detected:
                  type: boolean
              required: [detected]
      required:
        - score
        - status
        - scoreState
        - confidence
        - dataQuality
        - generatedAt
        - warnings
        - diagnostics
        - scan
        - alphaVelocity
        - changeIndicators
        - preBreakoutWatch
        - preBreakout
        - momentum
        - spread
        - volumeIntensity
        - orderFlowPressure
        - unusualActivity
    RadarMarketSnapshot:
      type: object
      properties:
        latestPrice:
          type: [number, "null"]
        bidPrice:
          type: [number, "null"]
        askPrice:
          type: [number, "null"]
        bidSize:
          type: [number, "null"]
        askSize:
          type: [number, "null"]
        lastTradeSize:
          type: [number, "null"]
        sessionVolume:
          type: [number, "null"]
        lastTradeAt:
          type: ["string", "null"]
          format: date-time
      required:
        - latestPrice
        - bidPrice
        - askPrice
        - bidSize
        - askSize
        - lastTradeSize
        - sessionVolume
        - lastTradeAt
    RadarSymbolStatus:
      type: object
      properties:
        symbol:
          type: string
        connectionState:
          $ref: "#/components/schemas/RadarConnectionState"
        marketFeedState:
          $ref: "#/components/schemas/MarketFeedState"
        lastUpdatedAt:
          type: ["string", "null"]
          format: date-time
        alphaRadar:
          $ref: "#/components/schemas/AlphaRadarSnapshot"
        signalHistory:
          type: array
          items:
            $ref: "#/components/schemas/AlphaRadarSignalHistoryEntry"
        market:
          $ref: "#/components/schemas/RadarMarketSnapshot"
        error:
          type: [string, "null"]
      required:
        - symbol
        - connectionState
        - marketFeedState
        - lastUpdatedAt
        - alphaRadar
        - signalHistory
        - market
        - error
    AlphaRadarSignalHistoryEntry:
      type: object
      properties:
        occurredAt:
          type: string
          format: date-time
        fromState:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        toState:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        fromConfirmationStatus:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        toConfirmationStatus:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        score:
          type: [number, "null"]
        confidence:
          type: number
        alphaVelocity:
          type: [number, "null"]
        evidenceCount:
          type: number
          minimum: 0
        satisfiedEvidence:
          type: array
          items:
            type: string
        missingEvidence:
          type: array
          items:
            type: string
        dataFresh:
          type: boolean
        reason:
          type: string
      required:
        - occurredAt
        - fromState
        - toState
        - fromConfirmationStatus
        - toConfirmationStatus
        - score
        - confidence
        - alphaVelocity
        - evidenceCount
        - satisfiedEvidence
        - missingEvidence
        - dataFresh
        - reason
    RadarTrade:
      type: object
      properties:
        price:
          type: number
        size:
          type: number
        timestamp:
          type: string
          format: date-time
        side:
          type: [string, "null"]
      required: [price, size, timestamp, side]
    RadarFreshness:
      type: string
      enum: [fresh, stale, insufficient, quiet]
    RadarSignal:
      type: object
      properties:
        score:
          type: [number, "null"]
        dataTimestamp:
          type: ["string", "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/RadarFreshness"
        detail:
          type: string
      required: [score, dataTimestamp, freshness, detail]
    RadarMomentumSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            changePercent:
              type: [number, "null"]
          required: [changePercent]
    RadarVolumeSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            recentVolume:
              type: [number, "null"]
            baselineVolume:
              type: [number, "null"]
            ratio:
              type: [number, "null"]
          required: [recentVolume, baselineVolume, ratio]
    RadarPressureSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            buyVolume:
              type: [number, "null"]
            sellVolume:
              type: [number, "null"]
            classifiedTrades:
              type: number
          required: [buyVolume, sellVolume, classifiedTrades]
    RadarSpreadSignal:
      allOf:
        - $ref: "#/components/schemas/RadarSignal"
        - type: object
          properties:
            spread:
              type: [number, "null"]
            spreadBps:
              type: [number, "null"]
          required: [spread, spreadBps]
    RadarActivityFlag:
      type: object
      properties:
        type:
          type: string
          enum: [elevated_volume, elevated_trades, wide_spread, unbalanced_pressure, quiet]
        label:
          type: string
        detail:
          type: string
      required: [type, label, detail]
    RadarSnapshot:
      type: object
      properties:
        score:
          type: [number, "null"]
        status:
          type: string
          enum: [neutral, watch, breakout_setup, data_stale, insufficient]
        dataTimestamp:
          type: ["string", "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/RadarFreshness"
        sampleCount:
          type: number
        windowSeconds:
          type: number
        momentum:
          $ref: "#/components/schemas/RadarMomentumSignal"
        volumeIntensity:
          $ref: "#/components/schemas/RadarVolumeSignal"
        pressure:
          $ref: "#/components/schemas/RadarPressureSignal"
        spread:
          $ref: "#/components/schemas/RadarSpreadSignal"
        activityFlags:
          type: array
          items:
            $ref: "#/components/schemas/RadarActivityFlag"
      required:
        - score
        - status
        - dataTimestamp
        - freshness
        - sampleCount
        - windowSeconds
        - momentum
        - volumeIntensity
        - pressure
        - spread
        - activityFlags
    RadarStream:
      type: object
      properties:
        schema:
          type: string
          enum: [mbp-1, ohlcv-1s]
        state:
          type: string
          enum: [waiting, receiving, error]
        eventCount:
          type: number
        lastEventAt:
          type: ["string", "null"]
          format: date-time
      required: [schema, state, eventCount, lastEventAt]
    RadarStatus:
      type: object
      properties:
        configured:
          type: boolean
        connectionState:
          $ref: "#/components/schemas/RadarConnectionState"
        marketFeedState:
          $ref: "#/components/schemas/MarketFeedState"
        provider:
          type: string
        dataset:
          type: string
        symbol:
          type: string
        startedAt:
          type: ["string", "null"]
          format: date-time
        lastUpdatedAt:
          type: ["string", "null"]
          format: date-time
        lastHeartbeatAt:
          type: ["string", "null"]
          format: date-time
        reconnectState:
          $ref: "#/components/schemas/RadarReconnectState"
        reconnectAttempt:
          type: number
        nextReconnectAt:
          type: ["string", "null"]
          format: date-time
        alphaRadar:
          $ref: "#/components/schemas/AlphaRadarSnapshot"
        signalHistory:
          type: array
          items:
            $ref: "#/components/schemas/AlphaRadarSignalHistoryEntry"
        error:
          type: ["string", "null"]
        market:
          $ref: "#/components/schemas/RadarMarketSnapshot"
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/RadarTrade"
        radar:
          $ref: "#/components/schemas/RadarSnapshot"
        streams:
          type: array
          items:
            $ref: "#/components/schemas/RadarStream"
        symbolRadars:
          type: array
          items:
            $ref: "#/components/schemas/RadarSymbolStatus"
        preBreakoutLeader:
          type: [object, "null"]
          properties:
            symbol:
              type: string
            state:
              $ref: "#/components/schemas/PreBreakoutDetectionState"
            confirmationStatus:
              $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
            alphaVelocity:
              type: [number, "null"]
          required: [symbol, state, confirmationStatus, alphaVelocity]
      required:
        - configured
        - connectionState
        - marketFeedState
        - provider
        - dataset
        - symbol
        - startedAt
        - lastUpdatedAt
        - lastHeartbeatAt
        - reconnectState
        - reconnectAttempt
        - nextReconnectAt
        - alphaRadar
        - signalHistory
        - error
        - market
        - recentTrades
        - radar
        - streams
        - symbolRadars
        - preBreakoutLeader
