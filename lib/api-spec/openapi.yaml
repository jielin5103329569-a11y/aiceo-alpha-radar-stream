            scheduledSymbols:
              type: number
              minimum: 0
            delayedSymbols:
              type: number
              minimum: 0
            inactiveSymbols:
              type: number
              minimum: 0
            reason: { type: string }
          required: [scheduledSymbols, delayedSymbols, inactiveSymbols, reason]
        recovery:
          type: object
          properties:
            phase:
              type: string
              enum: [stopped, starting, reconnecting, awaiting_live_event, rebuilding_window, running]
            rebuildingSymbols:
              type: number
              minimum: 0
            reason: { type: string }
          required: [phase, rebuildingSymbols, reason]
        alertDelivery:
          type: object
          properties:
