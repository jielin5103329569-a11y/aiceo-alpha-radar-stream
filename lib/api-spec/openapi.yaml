              enum: [available, unavailable]
            lastHeartbeatAt:
              type: [string, "null"]
              format: date-time
            lastActivityAt:
              type: [string, "null"]
              format: date-time
            lastConsumeAt:
              type: [string, "null"]
              format: date-time
            deliveriesAttempted:
              type: number
              minimum: 0
            deliveriesSucceeded:
              type: number
              minimum: 0
            deliveriesSkipped:
              type: number
              minimum: 0
            deliveriesFailed:
              type: number
              minimum: 0
            reason: { type: string }
          required: [serviceRunning, health, capability, lastHeartbeatAt, lastActivityAt, lastConsumeAt, deliveriesAttempted, deliveriesSucceeded, deliveriesSkipped, deliveriesFailed, reason]
        marketUniverse:
