openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: radar
    description: Safe market data connection and stream status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /radar/status:
    get:
      operationId: getRadarStatus
      tags: [radar]
      summary: Get the current safe market-data stream status
      responses:
        "200":
          description: Current radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/connect:
    post:
      operationId: startRadarConnection
      tags: [radar]
      summary: Start the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/disconnect:
    post:
      operationId: stopRadarConnection
      tags: [radar]
      summary: Stop the server-side Databento live connection
      responses:
        "200":
          description: Updated radar state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarStatus"
  /radar/events:
    get:
      operationId: streamRadarEvents
      tags: [radar]
      summary: Receive safe radar status updates as server-sent events
      responses:
        "200":
          description: Server-sent radar state updates
          content:
            text/event-stream:
              schema:
                type: string
  /radar/universe:
    get:
      operationId: getMarketUniverse
      tags: [radar]
      summary: Query the low-frequency U.S. equity reference universe
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 64
        - in: query
          name: eligibility
          schema:
            type: string
            enum: [eligible, ineligible, all]
            default: eligible
        - in: query
          name: lifecycle
          schema:
            anyOf:
              - $ref: "#/components/schemas/SecurityLifecycleStatus"
              - type: string
                enum: [all]
            default: all
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          schema:
            type: number
            minimum: 0
            default: 0
      responses:
        "200":
          description: Bounded reference-universe results and quality summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketUniverseResult"
  /radar/validation:
    get:
      operationId: getSignalValidation
      tags: [radar]
      summary: Get immutable signal validation metrics and recent records
      parameters:
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/ValidationSignalState"
        - in: query
          name: sector
          schema:
            type: string
            maxLength: 120
        - in: query
          name: signalType
          schema:
            $ref: "#/components/schemas/ValidationSignalType"
        - in: query
          name: horizonDays
          schema:
            type: number
            enum: [1, 3, 5, 10, 20]
            default: 5
        - in: query
          name: limit
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Persistent trigger-time records and future-only outcome metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalValidationDashboard"
  /radar/validation/signals/{signalId}:
    get:
      operationId: getSignalValidationAudit
      tags: [radar]
      summary: Audit one immutable signal and its outcome checkpoints
      parameters:
        - in: path
          name: signalId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Full trigger-time evidence chain and checkpoint history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalValidationAudit"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RadarConnectionState:
      type: string
      enum: [not_configured, connecting, connected, streaming, error, stopped]
    MarketFeedState:
      type: string
      enum: [streaming, stale, offline]
    RadarReconnectState:
      type: string
      enum: [idle, scheduled, reconnecting, exhausted]
    MarketUniverseRefreshState:
      type: string
      enum: [idle, refreshing, ready, degraded, unavailable]
    ReferenceFreshness:
      type: string
      enum: [fresh, stale, missing]
    ReferenceDataQuality:
      type: string
      enum: [good, degraded, unavailable]
    SecurityLifecycleStatus:
      type: string
      enum: [active, halted, inactive, delisted, unknown]
    SecurityEligibility:
      type: string
      enum: [eligible, ineligible]
    NormalizedSecurityType:
      type: string
      enum: [common_stock, fund, adr, preferred, warrant, unit, right, other, unknown]
    SecurityReference:
      type: object
      properties:
        symbol:
          type: string
        providerSymbol:
          type: string
        instrumentId:
          type: [string, "null"]
        listingId:
          type: [string, "null"]
        issuerName:
          type: [string, "null"]
        listingExchange:
          type: [string, "null"]
        primaryExchange:
          type: [string, "null"]
        securityType:
          $ref: "#/components/schemas/NormalizedSecurityType"
        providerSecurityType:
          type: [string, "null"]
        instrumentClass:
          type: [string, "null"]
        lifecycleStatus:
          $ref: "#/components/schemas/SecurityLifecycleStatus"
        lifecycleReason:
          type: string
        eligibility:
          $ref: "#/components/schemas/SecurityEligibility"
        eligibilityReasons:
          type: array
          items:
            type: string
        sector:
          type: [string, "null"]
        industryGroup:
          type: [string, "null"]
        industry:
          type: [string, "null"]
        classificationSource:
          type: [string, "null"]
        referenceUpdatedAt:
          type: string
          format: date-time
      required:
        - symbol
        - providerSymbol
        - instrumentId
        - listingId
        - issuerName
        - listingExchange
        - primaryExchange
        - securityType
        - providerSecurityType
        - instrumentClass
        - lifecycleStatus
        - lifecycleReason
        - eligibility
        - eligibilityReasons
        - sector
        - industryGroup
        - industry
        - classificationSource
        - referenceUpdatedAt
    MarketUniverseLifecycleCounts:
      type: object
      properties:
        active:
          type: number
          minimum: 0
        halted:
          type: number
          minimum: 0
        inactive:
          type: number
          minimum: 0
        delisted:
          type: number
          minimum: 0
        unknown:
          type: number
          minimum: 0
      required: [active, halted, inactive, delisted, unknown]
    MarketUniverseSummary:
      type: object
      properties:
        provider:
          type: string
          enum: [Databento]
        dataset:
          type: string
        source:
          type: string
        deliveryMode:
          type: string
          enum: [reference_only]
        refreshState:
          $ref: "#/components/schemas/MarketUniverseRefreshState"
        lastAttemptAt:
          type: ["string", "null"]
          format: date-time
        refreshedAt:
          type: ["string", "null"]
          format: date-time
        sourceTimestamp:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        freshness:
          $ref: "#/components/schemas/ReferenceFreshness"
        dataQuality:
          $ref: "#/components/schemas/ReferenceDataQuality"
        reason:
          type: string
        totalCount:
          type: number
          minimum: 0
        eligibleCount:
          type: number
          minimum: 0
        ineligibleCount:
          type: number
          minimum: 0
        commonEquityVerifiedCount:
          type: number
          minimum: 0
        classificationCoverageCount:
          type: number
          minimum: 0
        lifecycleCounts:
          $ref: "#/components/schemas/MarketUniverseLifecycleCounts"
        eligibleSample:
          type: array
          items:
            type: string
      required:
        - provider
        - dataset
        - source
        - deliveryMode
        - refreshState
        - lastAttemptAt
        - refreshedAt
        - sourceTimestamp
        - expiresAt
        - freshness
        - dataQuality
        - reason
        - totalCount
        - eligibleCount
        - ineligibleCount
        - commonEquityVerifiedCount
        - classificationCoverageCount
        - lifecycleCounts
        - eligibleSample
    MarketUniverseResult:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/MarketUniverseSummary"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityReference"
        total:
          type: number
          minimum: 0
        limit:
          type: number
          minimum: 1
        offset:
          type: number
          minimum: 0
      required: [summary, items, total, limit, offset]
    RadarSignalFreshness:
      type: string
      enum: [fresh, delayed, stale, missing]
    RadarSignalDataQuality:
      type: string
      enum: [good, degraded, stale, missing]
    AlphaRadarSignalState:
      type: string
      enum: [Neutral, Watch, Breakout Setup]
    AlphaRadarScoreState:
      type: string
      enum: [available, stale, insufficient]
    AlphaRadarDiagnostics:
      type: object
      properties:
        fresh_quotes:
          type: number
          minimum: 0
        fresh_trades:
          type: number
          minimum: 0
        fresh_prices:
          type: number
          minimum: 0
        fresh_volume:
          type: number
          minimum: 0
        valid_window_age:
          type: [number, "null"]
          description: Age in seconds of the active, real-observation scoring window.
        scoring_gate_reason:
          type: string
      required:
        - fresh_quotes
        - fresh_trades
        - fresh_prices
        - fresh_volume
        - valid_window_age
        - scoring_gate_reason
    AlphaRadarScanMetadata:
      type: object
      properties:
        lastScannedAt:
          type: string
          format: date-time
        scanIntervalMs:
          type: number
        scanMode:
          type: string
          enum: [normal, pre_open, opening]
        triggerReason:
          type: string
        eventTriggered:
          type: boolean
      required:
        - lastScannedAt
        - scanIntervalMs
        - scanMode
        - triggerReason
        - eventTriggered
    AlphaVelocity:
      type: object
      properties:
        delta30s:
          type: [number, "null"]
        delta60s:
          type: [number, "null"]
        rate30s:
          type: [number, "null"]
          description: Alpha score points per minute using the latest valid 30-second comparison.
        rate60s:
          type: [number, "null"]
          description: Alpha score points per minute using the latest valid 60-second comparison.
      required: [delta30s, delta60s, rate30s, rate60s]
    AlphaChangeIndicators:
      type: object
      properties:
        momentumAcceleration:
          type: [number, "null"]
          description: Momentum score-point change per minute between valid scans.
        volumeAcceleration:
          type: [number, "null"]
          description: Volume intensity score-point change per minute between valid scans.
        orderFlowShift:
          type: [number, "null"]
          description: Order-flow score-point change per minute between valid scans.
        spreadTightening:
          type: [number, "null"]
          description: Spread score-point change per minute; positive values indicate tightening.
      required: [momentumAcceleration, volumeAcceleration, orderFlowShift, spreadTightening]
    PreBreakoutDetectionState:
      type: string
      enum: [unavailable, watch, accelerating, pre_breakout, confirmed]
    PreBreakoutConfirmationStatus:
      type: string
      enum: [unavailable, pending, confirmed, rejected]
    PreBreakoutConfirmationEvidenceKey:
      type: string
      enum:
        - price_momentum
        - volume_acceleration
        - order_flow_pressure
        - spread_tightening
        - alpha_velocity
        - score_strength
        - trajectory_persistence
    PreBreakoutConfirmationEvidence:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/PreBreakoutConfirmationEvidenceKey"
        label:
          type: string
        satisfied:
          type: boolean
        detail:
          type: string
      required: [key, label, satisfied, detail]
    PreBreakoutConfirmation:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/PreBreakoutConfirmationEvidence"
        satisfiedEvidence:
          type: array
          items:
            type: string
        missingEvidence:
          type: array
          items:
            type: string
        persistenceScans:
          type: number
          minimum: 0
        requiredPersistenceScans:
          type: number
          minimum: 1
        evaluatedAt:
          type: string
          format: date-time
        reason:
          type: string
      required:
        - status
        - evidence
        - satisfiedEvidence
        - missingEvidence
        - persistenceScans
        - requiredPersistenceScans
        - evaluatedAt
        - reason
    PreBreakoutDetection:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        evidenceCount:
          type: number
          minimum: 0
        velocityGateSatisfied:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        deteriorationReasons:
          type: array
          items:
            type: string
        transitionEvidenceCount:
          type: number
          minimum: 0
        transitionReasons:
          type: array
          items:
            type: string
        lastTransitionAt:
          type: ["string", "null"]
          format: date-time
        lastEvaluatedAt:
          type: string
          format: date-time
        dataFresh:
          type: boolean
        cooldownRemainingMs:
          type: [number, "null"]
          minimum: 0
        confirmation:
          $ref: "#/components/schemas/PreBreakoutConfirmation"
      required:
        - state
        - evidenceCount
        - velocityGateSatisfied
        - reasons
        - deteriorationReasons
        - transitionEvidenceCount
        - transitionReasons
        - lastTransitionAt
        - lastEvaluatedAt
        - dataFresh
        - cooldownRemainingMs
        - confirmation
    RadarSignalMetric:
      type: object
      properties:
        value:
          type: [number, "null"]
        unit:
          type: string
        score:
          type: [number, "null"]
        observedAt:
          type: ["string", "null"]
          format: date-time
        freshnessMs:
          type: [number, "null"]
        freshness:
          $ref: "#/components/schemas/RadarSignalFreshness"
        available:
          type: boolean
        scoreEligible:
          type: boolean
        referenceValue:
          type: [number, "null"]
        referenceLabel:
          type: [string, "null"]
        source:
          type: string
      required:
        - value
        - unit
        - score
        - observedAt
        - freshnessMs
        - freshness
        - available
        - scoreEligible
        - referenceValue
        - referenceLabel
        - source
    AlphaRadarSnapshot:
      type: object
      properties:
        score:
          type: [number, "null"]
        status:
          anyOf:
            - $ref: "#/components/schemas/AlphaRadarSignalState"
            - type: "null"
        scoreState:
          $ref: "#/components/schemas/AlphaRadarScoreState"
        confidence:
          type: number
        dataQuality:
          $ref: "#/components/schemas/RadarSignalDataQuality"
        generatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        diagnostics:
          $ref: "#/components/schemas/AlphaRadarDiagnostics"
        scan:
          $ref: "#/components/schemas/AlphaRadarScanMetadata"
        alphaVelocity:
          $ref: "#/components/schemas/AlphaVelocity"
        changeIndicators:
          $ref: "#/components/schemas/AlphaChangeIndicators"
        preBreakoutWatch:
          type: boolean
        preBreakout:
          $ref: "#/components/schemas/PreBreakoutDetection"
        momentum:
          $ref: "#/components/schemas/RadarSignalMetric"
        spread:
          $ref: "#/components/schemas/RadarSignalMetric"
        volumeIntensity:
          $ref: "#/components/schemas/RadarSignalMetric"
        orderFlowPressure:
          $ref: "#/components/schemas/RadarSignalMetric"
        unusualActivity:
          allOf:
            - $ref: "#/components/schemas/RadarSignalMetric"
            - type: object
              properties:
                detected:
                  type: boolean
              required: [detected]
      required:
        - score
        - status
        - scoreState
        - confidence
        - dataQuality
        - generatedAt
        - warnings
        - diagnostics
        - scan
        - alphaVelocity
        - changeIndicators
        - preBreakoutWatch
        - preBreakout
        - momentum
        - spread
        - volumeIntensity
        - orderFlowPressure
        - unusualActivity
    RadarMarketSnapshot:
      type: object
      properties:
        latestPrice:
          type: [number, "null"]
        bidPrice:
          type: [number, "null"]
        askPrice:
          type: [number, "null"]
        bidSize:
          type: [number, "null"]
        askSize:
          type: [number, "null"]
        lastTradeSize:
          type: [number, "null"]
        sessionVolume:
          type: [number, "null"]
        lastTradeAt:
          type: ["string", "null"]
          format: date-time
      required:
        - latestPrice
        - bidPrice
        - askPrice
        - bidSize
        - askSize
        - lastTradeSize
        - sessionVolume
        - lastTradeAt
    RadarSymbolStatus:
      type: object
      properties:
        symbol:
          type: string
        connectionState:
          $ref: "#/components/schemas/RadarConnectionState"
        marketFeedState:
          $ref: "#/components/schemas/MarketFeedState"
        lastUpdatedAt:
          type: ["string", "null"]
          format: date-time
        alphaRadar:
          $ref: "#/components/schemas/AlphaRadarSnapshot"
        signalHistory:
          type: array
          items:
            $ref: "#/components/schemas/AlphaRadarSignalHistoryEntry"
        market:
          $ref: "#/components/schemas/RadarMarketSnapshot"
        liveIngestion:
          $ref: "#/components/schemas/LiveIngestionDiagnostics"
        error:
          type: [string, "null"]
      required:
        - symbol
        - connectionState
        - marketFeedState
        - lastUpdatedAt
        - alphaRadar
        - signalHistory
        - market
        - liveIngestion
        - error
    AlphaRankingEligibility:
      type: string
      enum: [ranked, building, ineligible]
    AlphaRankingTrajectory:
      type: string
      enum: [strengthening, stable, weakening, unavailable]
    AlphaRankingOrderStatus:
      type: string
      enum: [stable, pending]
    AlphaRadarRankingFactorContributions:
      type: object
      properties:
        alphaScore:
          type: number
          minimum: 0
        alphaVelocity:
          type: number
          minimum: 0
        componentAcceleration:
          type: number
          minimum: 0
        componentAccelerationAverage:
          type: number
        signalTrajectory:
          type: number
          minimum: 0
      required:
        - alphaScore
        - alphaVelocity
        - componentAcceleration
        - componentAccelerationAverage
        - signalTrajectory
    AlphaRadarRankingEntry:
      type: object
      properties:
        symbol:
          type: string
        rank:
          type: [number, "null"]
          minimum: 1
        eligibility:
          $ref: "#/components/schemas/AlphaRankingEligibility"
        orderStatus:
          anyOf:
            - $ref: "#/components/schemas/AlphaRankingOrderStatus"
            - type: "null"
        rankingScore:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        factorContributions:
          anyOf:
            - $ref: "#/components/schemas/AlphaRadarRankingFactorContributions"
            - type: "null"
        alphaScore:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        detectionState:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        confirmationStatus:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        alphaVelocity:
          type: [number, "null"]
        confidence:
          type: number
          minimum: 0
          maximum: 100
        trajectory:
          $ref: "#/components/schemas/AlphaRankingTrajectory"
        reason:
          type: string
      required:
        - symbol
        - rank
        - eligibility
        - orderStatus
        - rankingScore
        - factorContributions
        - alphaScore
        - detectionState
        - confirmationStatus
        - alphaVelocity
        - confidence
        - trajectory
        - reason
    AlphaRadarRankingSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AlphaRadarRankingEntry"
        leaderSymbol:
          type: [string, "null"]
        reorderPending:
          type: boolean
        pendingObservationCount:
          type: number
          minimum: 0
        requiredObservationCount:
          type: number
          minimum: 1
      required:
        - generatedAt
        - entries
        - leaderSymbol
        - reorderPending
        - pendingObservationCount
        - requiredObservationCount
    AlphaRadarSignalHistoryEntry:
      type: object
      properties:
        occurredAt:
          type: string
          format: date-time
        fromState:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        toState:
          $ref: "#/components/schemas/PreBreakoutDetectionState"
        fromConfirmationStatus:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        toConfirmationStatus:
          $ref: "#/components/schemas/PreBreakoutConfirmationStatus"
        score:
          type: [number, "null"]
        confidence:
          type: number
        alphaVelocity:
          type: [number, "null"]
        evidenceCount:
          type: number
          minimum: 0
        satisfiedEvidence:
          type: array
          items:
            type: string
        missingEvidence:
          type: array
          items:
            type: string
        dataFresh:
          type: boolean
        reason:
          type: string
      required:
        - occurredAt
        - fromState
        - toState
        - fromConfirmationStatus
        - toConfirmationStatus
        - score
        - confidence
        - alphaVelocity
        - evidenceCount
        - satisfiedEvidence
        - missingEvidence
        - dataFresh
        - reason
    ValidationSignalState:
      type: string
      enum: [watch, accelerating, pre_breakout, confirmed]
    ValidationSignalType:
      type: string
      enum: [state_transition, confirmation_transition]
    ValidationDirection:
      type: string
      enum: [upside, downside, neutral]
    ValidationCheckpointStatus:
      type: string
      enum: [pending, complete, unavailable]
    ValidationSampleState:
      type: string
      enum: [insufficient_sample, available]
    SignalValidationEvidence:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        satisfied:
          type: boolean
        detail:
          type: string
      required: [key, label, satisfied, detail]
    SignalValidationFreshness:
      type: object
      properties:
        marketFeedState:
          type: string
        dataQuality:
          type: string
        scoreState:
          type: string
        momentum:
          type: string
        volume:
          type: string
        orderFlow:
          type: string
        spread:
          type: string
      required:
        - marketFeedState
        - dataQuality
        - scoreState
        - momentum
        - volume
        - orderFlow
        - spread
    SignalValidationCheckpoint:
      type: object
      properties:
        horizonDays:
          type: number
          enum: [1, 3, 5, 10, 20]
        checkpointStatus:
          $ref: "#/components/schemas/ValidationCheckpointStatus"
        targetAt:
          type: string
          format: date-time
        observedAt:
          type: ["string", "null"]
          format: date-time
        observedPrice:
          type: [number, "null"]
        rawReturnPercent:
          type: [number, "null"]
        favorableReturnPercent:
          type: [number, "null"]
        maxDrawdownPercent:
          type: [number, "null"]
        hit:
          type: [boolean, "null"]
        leadTimeMinutes:
          type: [number, "null"]
        reason:
          type: string
      required:
        - horizonDays
        - checkpointStatus
        - targetAt
        - observedAt
        - observedPrice
        - rawReturnPercent
        - favorableReturnPercent
        - maxDrawdownPercent
        - hit
        - leadTimeMinutes
        - reason
    PersistedSignalValidationRecord:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        schemaVersion:
          type: number
        recordHash:
          type: string
        symbol:
          type: string
        occurredAt:
          type: string
          format: date-time
        fromState:
          type: string
        state:
          $ref: "#/components/schemas/ValidationSignalState"
        confirmationStatus:
          type: string
        signalType:
          $ref: "#/components/schemas/ValidationSignalType"
        direction:
          $ref: "#/components/schemas/ValidationDirection"
        triggerPrice:
          type: number
        alphaScore:
          type: [number, "null"]
        signalScore:
          type: [number, "null"]
        confidence:
          type: number
        volumeValue:
