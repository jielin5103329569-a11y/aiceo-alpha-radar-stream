    RuntimeSupervisorSnapshot:
      type: object
      description: >
        Read-only application supervision. Its state is explicitly separate from
        market freshness, Alpha scoring, Alert eligibility, and external Replit
        task-control-plane visibility.
      properties:
        schemaVersion:
          type: number
          enum: [1]
        observedAt: { type: string, format: date-time }
        running: { type: boolean }
        startedAt:
          type: [string, "null"]
          format: date-time
        lastInspectionAt:
          type: [string, "null"]
          format: date-time
        state:
          type: string
          enum: [healthy, degraded, recovering, blocked]
        reason: { type: string }
        application:
          type: object
          properties:
            process:
              type: string
              enum: [healthy, degraded, blocked]
            liveFeed:
              type: string
              enum: [healthy, recovering, degraded]
            alertService:
              type: string
              enum: [healthy, degraded]
            internalExecution:
              type: string
              enum: [healthy, recovering, degraded, blocked]
            dashboardDelivery:
              type: object
              properties:
                state:
                  type: string
                  enum: [observational_only]
                activeSseConnections:
                  type: number
                  minimum: 0
              required: [state, activeSseConnections]
          required: [process, liveFeed, alertService, internalExecution, dashboardDelivery]
        externalPlatform:
          type: object
          properties:
            taskControlPlane:
              type: string
              enum: [unobservable]
            affectsApplicationHealth:
              type: boolean
              enum: [false]
            reason: { type: string }
          required: [taskControlPlane, affectsApplicationHealth, reason]
        persistence:
          type: object
          properties:
            state:
              type: string
              enum: [ready, unavailable]
            lastPersistedAt:
              type: [string, "null"]
              format: date-time
            lastErrorAt:
              type: [string, "null"]
              format: date-time
            lastError:
              type: [string, "null"]
          required: [state, lastPersistedAt, lastErrorAt, lastError]
        recovery:
          type: object
          properties:
            maxAttempts:
              type: number
              minimum: 0
            activeAttempts:
              type: number
              minimum: 0
            nextEligibleAt:
              type: [string, "null"]
              format: date-time
            reason: { type: string }
          required: [maxAttempts, activeAttempts, nextEligibleAt, reason]
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeSupervisorIncidentSummary"
        auditHash: { type: string }
      required: [schemaVersion, observedAt, running, startedAt, lastInspectionAt, state, reason, application, externalPlatform, persistence, recovery, incidents, auditHash]
    RuntimeSupervisorError:
      type: object
      description: A read-only runtime supervisor endpoint error. It never indicates market or Alert eligibility.
      properties:
        error:
          type: string
      required: [error]
    RuntimeSupervisorIncidentSummary:
      type: object
      properties:
        incidentKey: { type: string }
        component:
          type: string
          enum: [process, live_feed, alert_service, internal_execution, dashboard_delivery, persistence]
        reasonCode: { type: string }
        severity:
          type: string
          enum: [warning, critical]
        state:
          type: string
          enum: [open, recovering, resolved]
        firstDetectedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        recoveryAttempts:
          type: number
          minimum: 0
        nextRecoveryAt:
          type: [string, "null"]
          format: date-time
        reason: { type: string }
      required: [incidentKey, component, reasonCode, severity, state, firstDetectedAt, lastObservedAt, recoveryAttempts, nextRecoveryAt, reason]
    RuntimeSupervisorEvidence:
      type: object
      properties:
        summary: { type: string }
        componentState: { type: string }
