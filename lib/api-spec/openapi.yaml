          required: [state, serviceRunning, refreshState, refreshInFlight, bridgeRunning, startedAt, stoppedAt, lastActivityAt, lastBridgeMessageAt, lastCompletedAt, lastAttemptAt, refreshedAt, freshness, dataQuality, reason]
